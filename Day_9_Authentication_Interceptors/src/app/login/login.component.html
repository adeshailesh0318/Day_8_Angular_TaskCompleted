<div class="login-page">

  <div class="login-card">

    <h2>Welcome Back</h2>

    <p class="subtitle">
      Login to your account
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label>Username</label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
        />

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
        />

      </div>

      <div
        class="error"
        *ngIf="errorMessage">

        {{ errorMessage }}

      </div>

      <button
        type="submit"
        [disabled]="loading">

        {{ loading ? 'Logging in...' : 'Login' }}

      </button>

    </form>

    <div class="demo-box">

      <strong>Demo Accounts</strong>

      <p>
        User: <b>user</b> / <b>1234</b>
      </p>

      <p>
        Admin: <b>admin</b> / <b>admin123</b>
      </p>

    </div>

  </div>

</div>
