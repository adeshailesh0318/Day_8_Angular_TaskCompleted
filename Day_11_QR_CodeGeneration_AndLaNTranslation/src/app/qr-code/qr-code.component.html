<div class="card shadow-sm">

  <div class="card-body">

    <div class="row">

      <!-- LEFT SIDE -->
      <div class="col-md-6">

        <h4 class="mb-4">
          {{ 'TITLE' | translate }}
        </h4>

        <div class="mb-3">

          <label class="form-label fw-bold">
            {{ 'QR_TEXT' | translate }}
          </label>

          <textarea
            class="form-control"
            rows="4"
            [(ngModel)]="qrData"
            [placeholder]="'PLACEHOLDER' | translate">
          </textarea>

        </div>

        <button
          class="btn btn-primary w-100 mb-4"
          (click)="generateQRCode()">

          {{ 'GENERATE' | translate }}

        </button>


        <!-- LOGO -->
        <div class="mb-3">

          <label class="form-label fw-bold">
            {{ 'LOGO' | translate }}
          </label>

          <input
            type="file"
            class="form-control"
            accept="image/*"
            (change)="onLogoSelected($event)">

        </div>

        <button
          *ngIf="logoUrl"
          class="btn btn-danger"
          (click)="removeLogo()">

          {{ 'REMOVE_LOGO' | translate }}

        </button>

      </div>


      <!-- RIGHT SIDE -->
      <div class="col-md-6 text-center">

        <h4 class="mb-4">
          {{ 'QR_PREVIEW' | translate }}
        </h4>

        <div class="qr-container">

          <qrcode
            [qrdata]="generatedData"
            [width]="250"
            [errorCorrectionLevel]="'M'"
            [elementType]="'canvas'">
          </qrcode>

          <!-- Logo Preview -->
          <img
            *ngIf="logoUrl"
            [src]="logoUrl"
            class="qr-logo"
            alt="Logo">

        </div>


        <div class="mt-4">

          <button
            class="btn btn-success me-2"
            (click)="downloadPNG()">

            {{ 'DOWNLOAD_PNG' | translate }}

          </button>

          <button
            class="btn btn-warning"
            (click)="downloadJPEG()">

            {{ 'DOWNLOAD_JPEG' | translate }}

          </button>

        </div>

      </div>

    </div>

  </div>

</div>
